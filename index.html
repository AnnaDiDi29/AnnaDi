<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ЗОЖ Дневник 2026</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(to bottom, #e8fff0, #ffffff);
    color: #2c3e50;
}

/* HEADER */
header {
    background: #2ecc71;
    color: white;
    text-align: center;
    padding: 25px;
}

/* ПРИВЕТСТВИЕ */
.greeting {
    background: white;
    margin: 15px auto;
    padding: 15px;
    max-width: 900px;
    border-radius: 12px;
    text-align: center;
    font-weight: bold;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
}

/* КАЛЕНДАРЬ */
.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    max-width: 900px;
    margin: 20px auto;
    padding: 10px;
}

.day {
    background: white;
    padding: 12px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    transition: 0.2s;
}

.day:hover {
    transform: scale(1.05);
}

/* УРОВНИ ПРОГРЕССА */
.low { border-left: 5px solid #e74c3c; }
.medium { border-left: 5px solid #f1c40f; }
.high { border-left: 5px solid #2ecc71; }

.percent {
    font-size: 12px;
    margin-top: 5px;
}

/* АКТИВНЫЙ ДЕНЬ */
.active {
    background: #2ecc71;
    color: white;
}

/* МЕНЮ */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    text-align: center;
    text-decoration: none;
    color: #2c3e50;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    background: #f3fff7;
}

/* ФУТЕР */
footer {
    text-align: center;
    padding: 20px;
    color: gray;
}
</style>
</head>

<body>

<header>
    <h1>🌿 ЗОЖ ДНЕВНИК 2026</h1>
</header>

<div class="greeting">
    Участник конкурса: «Крит-2026»
    Динина Анна приветствует жюри конкурса
</div>

<!-- 📅 УМНЫЙ КАЛЕНДАРЬ -->
<div class="calendar" id="calendar"></div>

<!-- 📌 МЕНЮ -->
<div class="grid">
    <a class="card" href="%D0%BF%D0%B8%D1%82%D0%B0%D0%BD%D0%B8%D0%B5.html">🥗 Питание</a>
    <a class="card" href="%D1%81%D0%BF%D0%BE%D1%80%D1%82.html">🏃 Спорт</a>
    <a class="card" href="%D0%BC%D0%B5%D0%BD%D1%82%D0%B0%D0%BB%D0%BA%D0%B0.html">🧠 Ментальное здоровье</a>
    <a class="card" href="%D1%82%D1%80%D0%B5%D0%BA%D0%B5%D1%80.html">📅 Привычки</a>
</div>

<footer>
    💚 Здоровье — это путь, а не цель
</footer>

<script>

/* ===== ПОЛУЧИТЬ ПРОЦЕНТ ДНЯ ===== */
function getPercent(day) {
    let data = JSON.parse(localStorage.getItem("habits_" + day));
    if (!data) return 0;

    let done = data.filter(v => v === true).length;
    return Math.round((done / data.length) * 100);
}

/* ===== СОЗДАНИЕ КАЛЕНДАРЯ ===== */
const calendar = document.getElementById("calendar");
let activeDay = localStorage.getItem("activeDay");

for (let i = 1; i <= 30; i++) {

    let percent = getPercent(i);

    let div = document.createElement("div");
    div.classList.add("day");

    // цвет
    if (percent === 0) div.classList.add("low");
    else if (percent < 70) div.classList.add("medium");
    else div.classList.add("high");

    // активный день
    if (activeDay == i) div.classList.add("active");

    div.innerHTML = `
        <div>День ${i}</div>
        <div class="percent">${percent}%</div>
    `;

    // переход
    div.onclick = () => {
        localStorage.setItem("activeDay", i);
        window.location.href = "%D1%82%D1%80%D0%B5%D0%BA%D0%B5%D1%80.html";
    };

    calendar.appendChild(div);
}

</script>

</body>
</html>
