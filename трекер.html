<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Трекер привычек | Я за ЗОЖ</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(to bottom, #e8fff0, #ffffff);
    color: #2c3e50;
}

header {
    background: #2ecc71;
    color: white;
    text-align: center;
    padding: 20px;
    position: sticky;
    top: 0;
}

.menu-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 15px;
    background: white;
    color: #2ecc71;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

/* ===== КАРТОЧКИ ===== */
.card {
    background: white;
    padding: 20px;
    margin: 15px 0;
    border-radius: 12px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);

    opacity: 0;
    transform: translateY(20px);
    animation: fadeIn 0.6s forwards;
}

.card:nth-child(1){animation-delay:0.1s}
.card:nth-child(2){animation-delay:0.2s}
.card:nth-child(3){animation-delay:0.3s}
.card:nth-child(4){animation-delay:0.4s}

@keyframes fadeIn {
    to {opacity:1; transform:translateY(0);}
}

h2 { color: #27ae60; }

/* ===== ЧЕКБОКСЫ ===== */
label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    margin: 10px 0;
}

/* ===== КНОПКА ===== */
button {
    padding: 10px 15px;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #27ae60;
}

/* ===== ПРОГРЕСС БАР ===== */
.progress-bar {
    width: 100%;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
}

.progress {
    height: 20px;
    width: 0%;
    background: #2ecc71;
    text-align: center;
    color: white;
    font-size: 12px;
    line-height: 20px;
    transition: width 0.4s;
}
</style>
</head>

<body>

<header>
    <h1>📅 Трекер привычек</h1>
    <a class="menu-btn" href="index.html">⬅ Главное меню</a>
</header>

<div class="container">

<!-- ОПИСАНИЕ -->
<div class="card">
    <h2>🔥 Формируй привычки</h2>
    <p>Каждый день маленькие шаги делают тебя лучше.</p>
</div>

<!-- ПРИВЫЧКИ -->
<div class="card">
    <h2>✔ Сегодняшние привычки</h2>

    <label><input type="checkbox" onchange="save()"> 💧 Выпить воду (2 л)</label>
    <label><input type="checkbox" onchange="save()"> 🚶 8000 шагов</label>
    <label><input type="checkbox" onchange="save()"> 🏃 Тренировка</label>
    <label><input type="checkbox" onchange="save()"> 🥗 Полезное питание</label>
    <label><input type="checkbox" onchange="save()"> 😴 Сон 7–8 часов</label>

    <button onclick="checkProgress()">Проверить прогресс</button>

    <div class="progress-bar">
        <div class="progress" id="bar">0%</div>
    </div>

    <p id="result"></p>
</div>

<!-- СОВЕТ -->
<div class="card">
    <h2>💡 Совет дня</h2>
    <p>Не пытайся изменить всё сразу — меняй одну привычку за раз.</p>
</div>

</div>

<script>
let day = localStorage.getItem("activeDay") || 1;

// загрузка по дню
function load() {
    let data = JSON.parse(localStorage.getItem("habits_" + day));
    if (!data) return;

    let checks = document.querySelectorAll("input[type='checkbox']");
    checks.forEach((c, i) => {
        c.checked = data[i];
    });
}

// сохранение по дню
function save() {
    let checks = document.querySelectorAll("input[type='checkbox']");
    let data = [];

    checks.forEach(c => data.push(c.checked));

    localStorage.setItem("habits_" + day, JSON.stringify(data));
}

// прогресс
function checkProgress() {
    let checks = document.querySelectorAll("input[type='checkbox']");
    let done = 0;

    checks.forEach(c => {
        if (c.checked) done++;
    });

    let percent = Math.round((done / checks.length) * 100);

    document.getElementById("bar").style.width = percent + "%";
    document.getElementById("bar").innerText = percent + "%";

    document.getElementById("result").innerText =
        "🔥 День " + day + ": " + percent + "% выполнено";
}

load();
</script>
</body>
</html>
